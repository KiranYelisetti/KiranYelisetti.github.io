<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiran Yelisetti Games</title>
<meta name="description" content="Small, calm puzzle games made by an independent developer in India.">
<style>
  :root { --ink:#2a1410; --muted:#7a5a3a; --gold:#b8892f; --paper:#fbf4e6; --maroon:#4a1d17; }
  * { box-sizing: border-box; }
  body { margin:0; font:17px/1.6 Georgia, 'Noto Serif', serif; color:var(--ink); background:var(--paper); }
  main { max-width:760px; margin:0 auto; padding:56px 20px 72px; }
  h1 { font-size:34px; line-height:1.15; margin:0 0 8px; }
  .lede { color:var(--muted); margin:0 0 40px; }
  .game { display:block; border:1px solid #e3d3b3; border-radius:18px; overflow:hidden; background:#fff; text-decoration:none; color:inherit; }
  .game img.banner { display:block; width:100%; height:auto; }
  .body { display:flex; gap:16px; align-items:center; padding:18px; }
  .body img { width:64px; height:64px; border-radius:14px; flex:none; }
  h2 { font-size:22px; margin:0 0 2px; }
  .body p { margin:0; color:var(--muted); font-size:15.5px; line-height:1.45; }
  .links { padding:0 18px 18px; font:600 14.5px/1 'Segoe UI', Roboto, sans-serif; }
  .links a { color:#8f1024; margin-right:18px; }
  footer { margin-top:48px; font-size:15px; color:var(--muted); }
  footer a { color:#8f1024; }
</style>
</head>
<body>
<main>
  <h1>Kiran Yelisetti Games</h1>
  <p class="lede">Small, calm puzzle games, made by one developer in India.</p>

  <div class="game">
    <img class="banner" src="bangle-bazaar/banner.png" alt="Bangle Bazaar banner showing stacks of coloured bangles" width="1024" height="500">
    <div class="body">
      <img src="bangle-bazaar/icon.png" alt="Bangle Bazaar icon" width="64" height="64">
      <div>
        <h2>Bangle Bazaar</h2>
        <p>Sort glittering bangles by colour. Endless levels, a daily puzzle, and no timer. For Android.</p>
      </div>
    </div>
    <div class="links">
      <a href="bangle-bazaar/privacy.html">Privacy policy</a>
    </div>
  </div>

  <footer>
    Contact: <a href="mailto:ravikiranyelisetti18@gmail.com">ravikiranyelisetti18@gmail.com</a>
  </footer>
</main>
</body>
</html>
